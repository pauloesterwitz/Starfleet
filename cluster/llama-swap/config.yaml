        # ds4 is huge (~108GB) — EXCLUSIVE: loading it clears spark-small; loading any spark-small
        # member clears ds4. So the big model is never co-resident with anything.
        # REACTIVATED 2026-08-26 (Paul): deepseek-v4-flash only. The ollama-backed
        # qwen3.5-122b / mistral-medium-3.5 / nemotron-3-super members that used to sit here were
        # deleted 2026-09-23 with the rest of the ollama deployment; their NVFP4 successors live
        # in the starfleet group instead (qwen3.5-122b-mtp3-starfleet, nemotron-120b-mtp3-starfleet).
        spark-big:
          swap: true
          exclusive: true
          members:
            - deepseek-v4-flash
            # The Kathryn twin belongs here too: swap:true is what makes picking a machine in
            # Fleet MOVE ds4 instead of leaving 81 GiB resident on both Sparks. The cost is that
            # loading it also clears spark-small, which sits on Jean-Luc and would physically
            # have been fine — llama-swap's groups are global, with no per-node notion, so the
            # conservative reading is the only safe one.
            - deepseek-v4-flash-kathryn
        # Small models CO-RESIDE: swap:false = run in parallel, don't evict each other. exclusive:true
        # only clears the OTHER group (ds4) when one loads — it does NOT evict siblings in this group.
        # Fit is gated per-model by memcheck (clean error if full); idle vLLM models unload via ttl.
        spark-small:
          swap: false
          exclusive: true
          members:
            # qwen3.6-35b-dflash removed — disabled member (see comment above), re-add on re-enable
            - qwen3.6-35b-85tps-mtp4-jean-luc
            - nemcascade-61tps-jean-luc
            - gemma4-26b-54tps-jean-luc
            - qwen3.8-27b-19tps-jean-luc
            - qwen3.8-27b-vision-jean-luc
        # KATHRYN's pool — a DIFFERENT machine's 121GB. exclusive:false is the whole point: these
        # members must never evict spark-big/spark-small and must never be evicted by them, because
        # loading a model over there frees nothing over here. Fit is gated by Kathryn's own memcheck
        # inside the ssh. swap:true = one Kathryn model at a time (31b needs 64GB of her 121GB).
        kathryn:
          swap: true
          exclusive: false
          members:
            - qwen3.6-35b-87tps-mtp4-kathryn
            - gemma4-26b-57tps-kathryn
            - qwen3.8-27b-20tps-kathryn
            - qwen3.8-27b-vision-kathryn
            - nemcascade-49tps-kathryn
        # ds4-tp2 GROUP REMOVED 2026-08-26: ds4-nvfp4-tp2 moved into `starfleet` below. That group
        # existed only because systemd, not llama-swap, owned the cluster's lifecycle, so llama-swap
        # had to be told never to evict it (exclusive:false + swap:false). Now that llama-swap starts
        # and stops it like any other member, it belongs with its peers: every starfleet member
        # occupies BOTH Sparks, so swap:true correctly evicts the previous cluster model on switch.
        # DYNAMIC members: node chosen at runtime by pick-node.sh, so they can't sit in a fixed-node
        # group. Own group, exclusive:false + swap:false — the chosen node's memcheck is the fit
        # authority (same "memcheck is the backstop" pattern the starfleet group uses).
        dyn-node:
          swap: false
          exclusive: false
          members:
            - qwen3.6-35b-86tps-mtp4-fastest-node
            - gemma4-26b-56tps-fastest-node
        # STARFLEET — each member occupies BOTH Sparks, so only ONE can be resident: swap:true evicts
        # the previous cluster model on switch (its teardown trap frees both nodes). exclusive:false +
        # memcheck is the backstop for the single-node members, exactly as the ds4-tp2 group does —
        # while a cluster model is up, MemAvailable drops and JL/Kathryn loads refuse cleanly.
        starfleet:
          swap: true
          exclusive: false
          members:
            - qwen3.5-122b-mtp3-starfleet
            - qwen3-235b-20tps-starfleet
            - minimax-awq-35tps-starfleet
            - gemma4-31b-19tps-starfleet
            - qwen3vl32-19tps-starfleet
            - qwen3vl32-vision-starfleet
            - nemotron-120b-mtp3-starfleet
            - qwenvl235-vision-starfleet
            - ds4-nvfp4-tp2   # moved here 2026-08-26 when llama-swap took over its lifecycle
            - qwen38fn-sglang-tp2-starfleet   # 2026-08-28: SGLang, not vLLM — occupies both Sparks
            - qwen38fn-long-sglang-tp2-starfleet   # 2026-09-20: same weights, YaRN factor 2.0, 512k, MTP K=3
            - glm53-awq-sglang-tp2-starfleet   # 2026-09-09: AWQ INT8 attention, 22.3 tok/s — the fast GLM
            # - qwen38flashnext-nvfp4-starfleet   # DISABLED 2026-08-28: qwen4_exp unsupported by both images (see member comment above)
        # ComfyUI's own container — exclusive:false + swap:false, same "isolated, never evicts
        # / never evicted" pattern as ds4-tp2 and qwen-dyn above. It's a different memory
        # subsystem (docker --gpus all container, not an llama-swap-launched vLLM proc).
        # Tiny (~1GB each) and co-resident with everything: swap:false so both can be up at once,
        # exclusive:false so an embedding call never clears an LLM group (and vice versa).
        embeddings:
          swap: false
          exclusive: false
          members:
            - nomic-embed-text
            - embeddinggemma
            - nomic-embed-text-kathryn
            - embeddinggemma-kathryn
            - harrier-embed-0.6b
            - harrier-embed-0.6b-kathryn
        # RERANKERS — split out of `embeddings` 2026-09-23 when the Qwen3 rerankers arrived.
        # Two reasons they are not embedders:
        #   swap:TRUE (the embeddings group is swap:false). A reranker is a CHOICE, not a
        #   component — a pipeline picks exactly one, and a resident Qwen3-Reranker-8B is 16.4 GB
        #   that no other reranker being up can justify. swap:true also gives Fleet's machine
        #   picker its meaning here: selecting Kathryn MOVES the reranker instead of leaving a
        #   copy resident on both Sparks, the same reasoning the spark-big group documents for ds4.
        #   exclusive:false, so a reranker still never evicts an LLM group and is never evicted by
        #   one — serve-embed.sh's per-key memcheck (26000MB / 16000MB) is the fit authority.
        rerankers:
          swap: true
          exclusive: false
          members:
            - bge-reranker-v2-m3
            - bge-reranker-v2-m3-kathryn
            - qwen3-reranker-8b
            - qwen3-reranker-8b-kathryn
            - qwen3-reranker-4b
            - qwen3-reranker-4b-kathryn
        imagegen:
          swap: false
          exclusive: false
          members:
            - imagegen
