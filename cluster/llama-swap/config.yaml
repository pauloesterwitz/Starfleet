# llama-swap — DGX Spark GB10 (121 GiB unified pool)
# One OpenAI-compatible endpoint arbitrating the GB10 pool between:
#   - spark-big  (ds4): EXCLUSIVE, one at a time — never co-resident with anything.
#   - spark-small (the single-node NVFP4 members): CO-RESIDENT up to memory.
#     memcheck refuses a load that won't fit (clean error, never OOM); idle vLLM models unload via ttl.
#
# Start:  ~/llama-swap/llama-swap -config ~/llama-swap/config.yaml -watch-config
# Use:    curl http://127.0.0.1:28080/v1/chat/completions -d '{"model":"deepseek-v4-flash",...}'
#         curl http://127.0.0.1:28080/v1/chat/completions -d '{"model":"gemma4:26b",...}'
#
# DYNAMIC CONTEXT SIZE (2026-08-21). Every member's cmd is prefixed with
#   ctx-env.sh <member>
# which reads ~/.gb10/ctx/<member> and exports MML_OVERRIDE / MAX_MODEL_LEN before exec'ing the
# rest of the chain. Callers set that file by going through ctxproxy.py on :28081 instead of
# :28080 and suffixing the model with @<tokens> (or sending an X-Context-Size header):
#         curl http://127.0.0.1:28081/v1/chat/completions \
#              -d '{"model":"qwen3.6-35b-85tps-mtp4-jean-luc@32768",...}'
# A DIFFERENT size than last time unloads the member so it reloads at the new context, i.e. it
# costs a cold load. The same size restarts nothing. Requests without a size, and everything
# still pointed at :28080, behave exactly as before.
# util / need_mb are NOT recomputed for the new context: a bigger KV cache comes out of the same
# tuned pool, and vLLM fails at startup (clean, not an OOM) if it does not fit.
# ADDING A MEMBER: put `ctx-env.sh <its own name>` first in its cmd, or ctxproxy 400s the @size
# for it. Skipped on purpose: nomic-embed-text, embeddinggemma, imagegen.

# ds4 loads ~81GB into the GB10 pool on first request; give startup plenty of time.
# (healthCheckTimeout is a GLOBAL setting in llama-swap, not per-model.)
# RAISED 1200 -> 2400 on 2026-08-10: 1200s was not enough for the big TP=2 members and hy3
# could never load at all. MEASURED cold loads that day: qwen3.5-122b 1150s, qwen3-235b 1218s
# (i.e. already AT the old ceiling), and hy3 at 168 GiB blew straight through it -> llama-swap
# killed it with 'health check timed out after 20m0s'. Do not lower this back without
# re-measuring the largest member's cold load.
healthCheckTimeout: 2400

# HTTP proxy timeouts. responseHeader is time to first byte from upstream — set to 0
# (unlimited) so 256K-context prefills (~776s on GB10) don't return 502 Bad Gateway.
# idleConn controls idle keep-alive connections.
timeouts:
  responseHeader: 0
  idle: 0
  idleConn: 120

models:
  # REACTIVATED 2026-08-26 (Paul): wanted DeepSeek V4 Flash back. Was DEPRECATED 2026-07-27 only
  # because the ollama backend it sat next to got turned off, not because ds4 itself broke.
  # antirez ds4 engine, IQ2_XXS routed-expert quant on CUDA/GB10. ds4flash.gguf is the
  # symlink download_model.sh created -> the 80.8 GiB chat-v2-imatrix GGUF.
  # serve-ds4.sh exec's ds4-server with the flags below baked in. ${PORT} is assigned
  # by llama-swap.
  # memcheck.sh refuses (exit 1 -> llama-swap errors) if ds4 won't fit the pool
  # right now, instead of loading ~108GB into it and OOM-killing the box. It
  # subtracts any live image/video reservation (gate.py). The MEMCHECK_RECLAIM_OLLAMA=1
  # this cmd used to carry was dropped 2026-09-23: it counted ollama-resident models as
  # reclaimable, and the ollama backend has been off since 2026-07-27 and is uninstalled.
  # reclaim-dflash.sh force-removes a leaked DFlash vLLM container (exclusive group) before
  # memcheck, so an orphaned container can't block/OOM ds4. exec chain preserves the PID.
  # EXCLUSIVE (spark-big, below): loading this evicts whatever else is on Jean-Luc's pool
  # (spark-small), and vice versa — 80.8 GiB doesn't leave room to co-reside with anything.
  deepseek-v4-flash:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh deepseek-v4-flash /home/pauloesterwitz/llama-swap/render-guard.sh /home/pauloesterwitz/llama-swap/reclaim-dflash.sh /home/pauloesterwitz/llama-swap/memcheck.sh 108000 /home/pauloesterwitz/ds4/serve-ds4.sh --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    # ds4-server has NO /health endpoint; point llama-swap's readiness probe at
    # /v1/models, which returns 200 exactly when ds4 has finished loading and can serve.
    checkEndpoint: /v1/models
    # ponytail: idle-unload after 15 min so a stray vane/opencode trigger can't squat 81 GiB
    # indefinitely. Drop this to pin ds4 resident if you're running a long ds4-only session.
    ttl: 900
    # Strip OpenAI parameters ds4-server doesn't support (avoids 400 errors from opencode).
    filters:
      stripParams: "store,metadata,service_tier,parallel_tool_calls,user,presence_penalty,frequency_penalty,logit_bias,logprobs,top_logprobs,n"

  # Kathryn twin, added 2026-09-23 — the last non-TP2 model with no machine to pick in Fleet.
  # Everything it needs was already mirrored there: ds4-server, the 81GB GGUF behind
  # ~/ds4/ds4flash.gguf, and serve-ds4.sh. serve-ds4.sh carries no memcheck of its own (on
  # Jean-Luc that chain lives in the cmd above), so serve-kathryn-ds4.sh reproduces
  # render-guard -> reclaim-dflash -> memcheck 108000 on KATHRYN's pool instead.
  # Same spark-big group as the Jean-Luc member: swap:true makes picking a machine MOVE ds4
  # rather than hold 81 GiB on both Sparks.
  # UNMEASURED on Kathryn; identical hardware, so expect the Jean-Luc figures.
  deepseek-v4-flash-kathryn:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh deepseek-v4-flash-kathryn /home/pauloesterwitz/llama-swap/serve-kathryn-ds4.sh --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /v1/models
    ttl: 900
    filters:
      stripParams: "store,metadata,service_tier,parallel_tool_calls,user,presence_penalty,frequency_penalty,logit_bias,logprobs,top_logprobs,n"

  # gemma4-26b-dflash RETIRED 2026-07-20: it was the DFlash speculative-decoding member, and DFlash is
  # being dropped ("not working well for agentic coding") — its draft weights are deleted. It was also
  # strictly superseded: gemma4-26b-54tps-jean-luc serves the SAME base model at 54.0 tok/s vs 27.7.
  # The nvidia NVFP4 weights + the `gemma4-26b` KEY remain, so it can be re-added draft-free if wanted.

  # ── qwen3.6-35b NVFP4 — Paul's fast default, SINGLE-NODE, node SELECTABLE (JL here / Kathryn below) ──
  # MEASURED 2026-07-17: single-node 27.1 tok/s BEATS TP=2's 23.6 — only ~3B active params/token, so
  # there is almost nothing for tensor-parallel to split and the per-token cross-node all-reduce is pure
  # loss. So it runs on ONE Spark; pick the node by requesting -jl or -kathryn. (ds4-tp2-vs-pp-results.md)
  # Only the MTP spec-4 recipe (57.1 tok/s, FINAL-results-table.md row 1) is served — the plain 27.1
  # non-MTP members were REMOVED 2026-07-27 as strictly-slower duplicates of the same weights.

  # Jean-Luc's pool, co-resident (spark-small). need_mb 43000 tracks util 0.35 (~42 GiB = ~22 GiB
  # weights + fp8 KV). nightly image (v0.21 lacks Qwen3_5MoeForConditionalGeneration). ttl unloads idle.
  qwen3.6-35b-85tps-mtp4-jean-luc:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh qwen3.6-35b-85tps-mtp4-jean-luc /home/pauloesterwitz/llama-swap/render-guard.sh /home/pauloesterwitz/llama-swap/memcheck.sh 43000 /home/pauloesterwitz/llama-swap/serve-vllm-dflash.sh qwen3.6-35b-mtp4 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health
    useModelName: qwen3.6-35b-mtp4-nvfp4

  # ── Qwen3.8-27B NVFP4 — DENSE hybrid (48/64 linear-attn + 16 full), MTP K=3, wired 2026-08-18 ──
  # 13.6 tok/s MEASURED AS SERVED (CUDA graphs on, MTP K=3, 262144 ctx, util 0.45) — not the sweep's
  # 12.9, which was eager at ctx 32768. SINGLE-NODE on purpose: see the measured TP=2 post-mortem
  # further down (it is both slower and unstable at these settings). MTP K=3 is the sweep optimum —
  # K=1 11.1, K=2 11.5, K=3 12.9, K=4 11.9, K=5 11.7 — a genuine peak, and acceptance is 2.12 of a
  # possible 4.0.
  # CONCURRENCY: 201.6 tok/s aggregate at 32 in flight (per-request still 6.8). That needed
  # --max-num-seqs 32 in serve-vllm-dflash.sh — the shared default of 4 was capping aggregate at
  # ~48 and the earlier "~47 aggregate" note was measuring that cap, not the hardware. Weights are
  # read once per forward pass regardless of batch size on a bandwidth-bound box, so batching is
  # nearly free: prefer ONE llama-swap endpoint with many concurrent requests over serialising them.
  # Ceiling note: per-decode read is 12.76 GiB body + 2.37 GiB BF16 lm_head = 15.13 GiB, so at the
  # GB10's 273 GB/s the no-MTP roofline is ~16.8 tok/s. Quantizing lm_head to NVFP4 would cut 2.07
  # GiB/step and lift that to ~19.5 — the biggest remaining win, and a checkpoint job, not a flag.
  # need_mb 55000 tracks util 0.45 (~54.8 GiB) — see the fit math in serve-vllm-dflash.sh.
  qwen3.8-27b-19tps-jean-luc:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh qwen3.8-27b-19tps-jean-luc /home/pauloesterwitz/llama-swap/render-guard.sh /home/pauloesterwitz/llama-swap/memcheck.sh 55000 /home/pauloesterwitz/llama-swap/serve-vllm-dflash.sh qwen3.8-27b --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health
    useModelName: qwen3.8-27b-nvfp4
    aliases:
      - qwen3.8-27b
      - Qwen3.8-27B-NVFP4

  # SAME checkpoint and tuning as the member above, with the vision encoder ENABLED (image:1).
  # Added 2026-08-20 on Paul's instruction ("we will also use the vision tower"). Reasoning stays
  # on here too. UNMEASURED: the vision encoder reserves activation memory the text-only rows never
  # paid for, so the 13.6 tok/s figure does NOT apply — re-bench before quoting a number, and
  # re-check need_mb 55000, which was sized for the text-only path.
  # Same two-member pattern as qwen3vl32 / qwen3vl32-vision in the starfleet group: keep the fast
  # text-only member as the default and reach for this one only when images are actually involved.
  qwen3.8-27b-vision-jean-luc:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh qwen3.8-27b-vision-jean-luc /home/pauloesterwitz/llama-swap/render-guard.sh /home/pauloesterwitz/llama-swap/memcheck.sh 55000 /home/pauloesterwitz/llama-swap/serve-vllm-dflash.sh qwen3.8-27b-vision --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health
    useModelName: qwen3.8-27b-vision-nvfp4
    aliases:
      - qwen3.8-27b-vision

  # Same weights/flags on Kathryn. 13.6 is the JEAN-LUC number (identical GB10 hardware) — this
  # member is UNMEASURED, because Kathryn's LAN interface was down when it was wired.
  qwen3.8-27b-20tps-kathryn:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh qwen3.8-27b-20tps-kathryn /home/pauloesterwitz/llama-swap/serve-kathryn.sh qwen3.8-27b 55000 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health
    useModelName: qwen3.8-27b-nvfp4

  # Kathryn twin of qwen3.8-27b-vision-jean-luc — same weights/flags, key already dispatched by
  # serve-vllm-dflash.sh's shared qwen3.8-27b|qwen3.8-27b-vision case, so serve-kathryn.sh needs no
  # changes. Added 2026-08-26 so the vision member isn't Jean-Luc-only like every other single-node
  # model in this fleet. UNMEASURED (inherits the vision member's own UNMEASURED caveat).
  qwen3.8-27b-vision-kathryn:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh qwen3.8-27b-vision-kathryn /home/pauloesterwitz/llama-swap/serve-kathryn.sh qwen3.8-27b-vision 55000 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health
    useModelName: qwen3.8-27b-vision-nvfp4

  # ── KATHRYN's pool (the second Spark) — reached over ssh, arbitrated by HER memcheck ──
  # serve-kathryn.sh ssh's to kathryn.fritz.box, runs HER memcheck.sh against HER 121GB pool, starts
  # the container there, and tunnels her loopback port back here. Jean-Luc's memcheck deliberately
  # does NOT gate these: the memory is on the other machine. See the `kathryn` group below —
  # exclusive:false, so loading this NEVER evicts ds4/nemotron here, and they never evict it.
  # REMOVED 2026-07-27: gemma4-31b-nvfp4-kathryn (10.4 tok/s single) — the TP=2 member
  # gemma4-31b-19tps-starfleet serves the same weights at 18.6 (FINAL-results-table.md row 10)
  # and now carries the Gemma-4-31B-IT-NVFP4 alias.
  # SAME model on KATHRYN alone — selecting this member vs the -jean-luc one chooses the node. serve-
  # kathryn.sh ssh's over, runs HER memcheck (gates HER pool) + serve-vllm-dflash.sh, and tunnels the
  # loopback port back here. kathryn group is exclusive:false (never evicts Jean-Luc) + swap:true.
  # Native MTP spec=4 (Paul 2026-07-22): 57.1 tok/s single-node, the fast one.
  qwen3.6-35b-87tps-mtp4-kathryn:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh qwen3.6-35b-87tps-mtp4-kathryn /home/pauloesterwitz/llama-swap/serve-kathryn.sh qwen3.6-35b-mtp4 43000 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 600
    useModelName: qwen3.6-35b-mtp4-nvfp4

  # Same dynamic node pick, but the MTP spec-4 recipe — 57.1 tok/s instead of 27.1. Added
  # 2026-07-27: the auto-node convenience member only existed in the SLOW non-MTP flavour,
  # so anything that wanted "just give me qwen3.6-35b on whichever Spark is free" silently
  # got half the throughput. Both serve scripts already accept the qwen3.6-35b-mtp4 key.
  qwen3.6-35b-86tps-mtp4-fastest-node:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh qwen3.6-35b-86tps-mtp4-fastest-node /home/pauloesterwitz/llama-swap/pick-node.sh qwen3.6-35b-mtp4 43000 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 600
    useModelName: qwen3.6-35b-mtp4-nvfp4

  # ══ gemma-4-26B-A4B (prithiv compressed-tensors NVFP4A16) — THE ONE FASTEST-ONLY EXCEPTION ══
  # MEASURED 2026-07-20: 46.2 tok/s single-node / 48.2 TP=2 (agg@16: 331.7 single vs 453.8 TP=2).
  # Every OTHER model in this config is served in its single fastest configuration only. gemma-4-26B
  # keeps all four (Paul, 2026-07-27): TP=2 buys just +2 tok/s (+4%) but costs BOTH Sparks, so the
  # node choice is worth more than the win. Pick by member name:
  #   -fastest-node  = whichever Spark has the most free memory right now (the sane default)
  #   -jean-luc / -kathryn = force a node (keep the other Spark free for something else)
  #   -48tps-starfleet     = TP=2 across both, for the +2 tok/s / 453.8 aggregate @16 concurrent
  gemma4-26b-56tps-fastest-node:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh gemma4-26b-56tps-fastest-node /home/pauloesterwitz/llama-swap/pick-node.sh gemma4-26b-ct 50000 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health
    useModelName: gemma4-26b-ct-nvfp4

  gemma4-26b-54tps-jean-luc:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh gemma4-26b-54tps-jean-luc /home/pauloesterwitz/llama-swap/render-guard.sh /home/pauloesterwitz/llama-swap/memcheck.sh 50000 /home/pauloesterwitz/llama-swap/serve-vllm-dflash.sh gemma4-26b-ct --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health
    useModelName: gemma4-26b-ct-nvfp4

  gemma4-26b-57tps-kathryn:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh gemma4-26b-57tps-kathryn /home/pauloesterwitz/llama-swap/serve-kathryn.sh gemma4-26b-ct 50000 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health
    useModelName: gemma4-26b-ct-nvfp4

  # ── DeepSeek-V4-Flash-NVFP4, TP=2 across BOTH Sparks (vLLM + Ray + RoCE) — PROXY ONLY ──
  # The cluster is started OUT OF BAND:  systemctl --user start ds4-tp2   (~14min cold load; it owns
  # BOTH Sparks, ~98G Jean-Luc + ~95G Kathryn; Kathryn's worker is started automatically over ssh).
  # llama-swap does NOT lifecycle-manage it: a 2-node Ray cluster is too fragile to hot-swap, and a
  # 14-minute load would hang any client long before it answered, so the member parks on a
  # placeholder process and proxies to the cluster instead. ds4-tp2-proxy-guard.sh fast-fails with a hint if the cluster isn't up — otherwise llama-swap
  # would sit on the failing checkEndpoint for the whole 2400s healthCheckTimeout and look hung.
  # DISTINCT from `deepseek-v4-flash` above (antirez ds4 engine, IQ2_XXS GGUF, single-node) — same
  # model family, different engine + quant. MEASURED 2026-07-17: 18.5 tok/s single-stream, 105.4 agg
  # @16 concurrent; beats PP=2 on every axis. Details: ~/llama-swap/ds4-tp2-vs-pp-results.md
  # REACTIVATED 2026-08-26 (Paul), and now FULLY llama-swap-managed (was proxy-only).
  # Selecting it in opencode STARTS the cluster; no `systemctl --user start ds4-tp2` needed.
  # ds4-tp2-proxy-guard.sh parks-and-proxies if a cluster is already up (systemd preload stays
  # respected) and otherwise launches one it owns, so eviction and ttl free both Sparks.
  # Moved into the `starfleet` group below: like every other member there it occupies BOTH Sparks,
  # so swap:true must evict the previous cluster model on switch. It sat in its own group only
  # because systemd, not llama-swap, used to own its lifecycle.
  # MEASURED 2026-08-26: 18.6 tok/s single-stream, 106.1 aggregate @16, cold load 931s.
  ds4-nvfp4-tp2:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh ds4-nvfp4-tp2 /home/pauloesterwitz/llama-swap/ds4-tp2-proxy-guard.sh
    proxy: http://127.0.0.1:8000
    checkEndpoint: /v1/models
    # ttl 3600, NOT the starfleet-standard 900. RULE: never set a ttl shorter than the cold load.
    # This model takes 931s to load, so a 900s idle-unload would spend more wall clock loading than
    # serving and re-load on the next stray request. Pin it resident with ttl: 0 for a long session.
    ttl: 3600
    aliases:
      - deepseek-v4-19tps-starfleet   # descriptive legacy name; real measured figure is 18.6 tok/s

  # gemma4-26b-48tps-starfleet REMOVED 2026-08-26 (Paul): TP=2 is now SLOWER than single-node
  # for this model — 43.5 tok/s across both Sparks vs 54-57 on one. CUDA graphs are worth
  # +17..52% single-node but break TP=2 on this hardware (vllm#41530/#40969, every graph mode
  # either crashes or is slower — retested 2026-08-25 on a healthy GPU). So two Sparks buy
  # nothing here. Use gemma4-26b-46tps-{jean-luc,kathryn,fastest-node} instead.

  # REMOVED 2026-07-27: qwen3.5-122b-21tps-starfleet (21 tok/s, no MTP) — superseded by the
  # MTP spec-3 member below at 40.3 (FINAL-results-table.md row 4).

  # ── The fleet's FIRST SGLang member. Everything else here is vLLM. ────────────────────────
  # Qwen3.8-Flash-Next (125B total / 6B active MoE + a 51B-param PLE n-gram table), TP=2 across
  # BOTH Sparks. 37.4 tok/s untuned (2026-08-28) -> 49.4 tok/s with MTP K=3 (2026-08-29 sweep,
  # see serve-sglang.sh for the full table) — ahead of nemotron-120b-mtp3 (36.1) and
  # minimax-awq (36.8).
  # REAL-WORLD, from 248 decode samples of a live 2026-09-02 session at ~254K context
  # (~170K tokens resident): throughput p25 32.0 / median 37.9 / p75 50.2 tok/s, and acceptance
  # p25 1.90 / median 2.38 / max 4.00. Two things worth knowing from that: 49.4 is the SHORT-
  # CONTEXT best case, and speculation actually works BETTER on real text than on the benchmark
  # prompts (acceptance 2.38 vs 1.75) — the throughput you lose at long context is the KV cache,
  # not worse drafting.
  # WHY SGLANG AND NOT vLLM: vLLM cannot fit this model on two Sparks, structurally. It expands
  # the PLE table to BF16 (~95GB) on rank 0 and OOM'd at ~116/121GB across five configurations
  # and three different quants. SGLang keeps the table in fp8 AND shards it across the TP group
  # (VocabParallelEmbedding), so the load is balanced: peaks JL 102GB / KA 97GB, no OOM.
  # IMAGE (HISTORICAL — RETIRED 2026-09-07, this build corrupts decode on GB10; now serving
  # lmsysorg/sglang:dev-qwen38-next-local unpatched):
  # IMAGE: sglang-qwen38fn-gb10:local — the stock lmsysorg/sglang:qwen38flashnext plus a ONE-LINE
  # GB10 patch (~/vllm-ray-build/Dockerfile.sglang-gb10). Upstream gates its fast QSA decode on
  # is_sm100_supported(); GB10 is sm_121, so it fell through to an FA4 cute kernel that cannot
  # JIT-compile here (MLIRError). The patch lets sm_12x take the trtllm-gen path. Without it this
  # model does not serve at all on this hardware — see run-sglang-tp2-cluster.sh for the full story.
  # PARSERS: reasoning=qwen3-thinking (NOT plain qwen3 — this model emits a closing </think> with
  # no opening tag, and the qwen3 parser then leaks raw chain-of-thought into content, the same
  # bug the Qwen3-VL members hit), tool-call=qwen3_coder for opencode's tool_choice:"auto".
  # Occupies BOTH Sparks, so it belongs to the starfleet group and evicts other cluster members.
  # SUPERSEDED 2026-09-07 evening — MTP IS BACK ON, and the real culprit was our own image.
  # The corruption came from Dockerfile.sglang-gb10 widening _resolve_trtllm_sparse_decode() to
  # sm_121; upstream now ships a native GB10 kernel (qwen38_qsa_sm121_varlen) and warns in-code
  # against exactly that widening. Now serving lmsysorg/sglang:dev-qwen38-next-local UNPATCHED
  # with MTP K=1. MEASURED on the production path: 0 collapses in 80 samples, 0 bad long-context
  # stages (2k->100k), tool calls 3/3, 48.9 tok/s (was 37-38). Losslessness is unprovable here --
  # see serve-sglang.sh. The stale note below is kept because its measurements were real ON THE
  # PATCHED IMAGE:
  # MTP REMOVED 2026-09-07 — IT CORRUPTED OUTPUT. With --speculative-algorithm NEXTN, 6 of 10
  # reasoning-heavy requests degenerated into a run of "!" (token id 0: NaN logits, and every
  # comparison against NaN is false, so argmax returns index 0). Without it: 0 of 10.
  # SPEED IS NOT THE TRADE-OFF IT LOOKED LIKE: median 26.2 tok/s with MTP vs 36.9 without, because
  # on long generations speculation dies mid-stream (server log: "accept rate: 0.00", never
  # recovers) and pays the draft cost for nothing. The +35%/49.4 tok/s in the tuning table is real
  # only for SHORT benchmark prompts. VERIFIED ON THIS PATH: 0/10 collapses, 35.4 tok/s, tool
  # calls 3/3. Full reasoning in serve-sglang.sh under the qwen38fn key.
  # ── Qwen3.8-Flash-Next at 512k, via a YaRN rope override (2026-09-20) ────────────────────────
  # SIBLING of qwen38fn-sglang-tp2-starfleet below, which is UNCHANGED at its native 262,144.
  # Same split as glm53-awq / glm53-awq-long. Nothing here touches the default member.
  #
  # 262,144 is a POSITIONAL wall, not a memory one: the KV pool at mem-fraction 0.80 already
  # holds ~690k tokens, so 512k costs no extra memory. A YaRN factor-2.0 override on
  # text_config.rope_parameters doubles the window; the full flag lives in serve-sglang.sh
  # under the `qwen38fn-long` key, which also carries the three ways this override can silently
  # no-op. Do not reproduce the JSON here.
  #
  # MEASURED 2026-09-20 at 479,655 prompt tokens (1.83x native), needle at depths 0.10/0.50/0.90:
  # 3/3 exact recall, and short EN/DE/code prompts diffed against the unscaled member showed no
  # static-YaRN tax.
  # SPEED: ~23.7 tok/s steady-state decode (temp 0, 1500-token generations). A 6-arm sweep at
  # this config (.yarn/sweep-512k.log) ranked k1-bounded first at 21.4 vs 19.1 for the old
  # unbounded K=3, but that harness counts prefill in its rate over 192-token generations; on the
  # longer measurement the two configs TIE (23.6 vs 23.7). Bounding is kept for the ~7 GB it
  # frees, not for speed.
  # The 2026-08-29 K table is NOT applicable -- it was taken at ctx 16384 where K=3 won at 49.4;
  # at 512k the whole field sits near 20 and K=1 edges it. Two earlier numbers in this file's
  # history were wrong and are retracted: "66.2 tok/s at K=3" came from a 1.4-SECOND decode
  # window right after a 480k prefill, not steady state. CUDA graphs are worth 2x here
  # (21.4 -> 10.6 without) and MTP only +20% (17.9 without). Flag rationale: serve-sglang.sh.
  # This member is ~half the speed of the 262k one (48.9 tok/s) -- that is the price of the
  # window, which is exactly why both members exist.
  #
  # ttl 3600 like the other long members (cold load ~540s, same weights as the 262k member).
  # Per-member context lives in ~/.gb10/ctx/<member>; this one is set to 524288.
  qwen38fn-long-sglang-tp2-starfleet:
    cmd: /home/pauloesterwitz/llama-swap/ctx-env.sh qwen38fn-long-sglang-tp2-starfleet /home/pauloesterwitz/llama-swap/serve-sglang.sh qwen38fn-long --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    cmdStop: /home/pauloesterwitz/llama-swap/run-sglang-tp2-cluster.sh down
    ttl: 3600
    useModelName: qwen38fn-long-sglang-tp2
    aliases:
