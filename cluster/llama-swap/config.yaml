    # BOTH nodes were left running with a dead owner after every unload (reaper caught orphans
    # aged 2364s, 1936s, 4398s). Backgrounding the log follow so the trap could fire (2026-09-10)
    # fixed a DIRECT SIGTERM in testing but did NOT fix llama-swap's actual unload path.
